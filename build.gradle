plugins {
    id 'java'
}

group = 'interview.prep'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

dependencies {
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// Discover self-contained exercises while keeping one shared Gradle project.
def problemJavaDirs = file('problems').listFiles().findAll { it.directory }.collectMany { category ->
    category.listFiles().findAll { it.directory }.collect { problem ->
        new File(problem, 'java')
    }.findAll { it.directory }
}

sourceSets {
    main {
        java {
            setSrcDirs(problemJavaDirs.collect { new File(it, 'src/main/java') })
        }
    }
    test {
        java {
            setSrcDirs(problemJavaDirs.collect { new File(it, 'src/test/java') })
        }
    }
}

test {
    useJUnitPlatform()
}
